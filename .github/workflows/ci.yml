name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    # Job-level env so the upload step's `if:` can read them. Step-level env
    # is not available during `if:` evaluation (it is set right before run).
    env:
      # Only the token is a secret. The base URL is public and the repository id is
      # a UUID, so both are repository *variables* — which is also the pattern the
      # settings panel now tells users to follow. Treating all three as secrets is
      # what made this a three-step setup nobody finished.
      IDP_BASE_URL: ${{ vars.IDP_BASE_URL }}
      IDP_REPOSITORY_ID: ${{ vars.IDP_REPOSITORY_ID }}
      IDP_COVERAGE_TOKEN: ${{ secrets.IDP_COVERAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      # Say out loud when the upload is skipped. The guard below is still right —
      # a missing token must not fail a merge — but on its own it made an
      # unconfigured repository indistinguishable from one with no coverage, on
      # both ends. That silence is why the coverage feature shipped and stayed off:
      # nobody could tell it was never wired up.
      - name: Explain a skipped coverage upload
        if: ${{ env.IDP_BASE_URL == '' || env.IDP_REPOSITORY_ID == '' || env.IDP_COVERAGE_TOKEN == '' }}
        run: |
          echo "::notice::Coverage upload skipped — the IDP is not configured for this repository."
          echo "Missing:"
          [ -z "$IDP_BASE_URL" ]       && echo "  - variable IDP_BASE_URL (the IDP's public URL)"
          [ -z "$IDP_REPOSITORY_ID" ]  && echo "  - variable IDP_REPOSITORY_ID"
          [ -z "$IDP_COVERAGE_TOKEN" ] && echo "  - secret IDP_COVERAGE_TOKEN"
          echo "Settings > repository > 'Como configurar o CI' has the values."
          exit 0

      # Upload to the IDP backend's own coverage endpoint. Soft-fail on
      # purpose: this is dogfooding, and a missing/expired token, network
      # blip, or undeployed backend must never block a merge.
      - name: Upload coverage to IDP (best-effort)
        if: ${{ env.IDP_BASE_URL != '' && env.IDP_REPOSITORY_ID != '' && env.IDP_COVERAGE_TOKEN != '' }}
        continue-on-error: true
        run: |
          set +e
          curl --max-time 30 --fail-with-body -X POST \
            "$IDP_BASE_URL/api/v1/repositories/$IDP_REPOSITORY_ID/coverage" \
            -H "Authorization: Bearer $IDP_COVERAGE_TOKEN" \
            -H "X-Coverage-Format: go" \
            -H "X-Commit-SHA: $GITHUB_SHA" \
            -H "X-Coverage-Branch: ${GITHUB_REF#refs/heads/}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @coverage.out
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::coverage upload returned non-zero ($status) — backend likely unreachable, ignoring"
          fi
          exit 0
